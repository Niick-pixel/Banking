# Publishes the web app (no data: everything stays on each device) to GitHub Pages,
# so it can be opened in Safari on iPhone and added to the Home Screen.
# Manual only for now (phone use is parked). To use it later:
#   1. repo Settings → Pages → Source: "GitHub Actions"
#   2. Actions → "Web app (GitHub Pages)" → Run workflow
name: Web app (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc -b && npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Deep links (e.g. /Banking/tracker) must load the app, not a 404 page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
